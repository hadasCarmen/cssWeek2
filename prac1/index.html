<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section class="section1">
      <div>
        <h1 id="logo">NotesApp</h1>
      </div>
      <nav class="nav1">
        <a class="a1" href="Home">Home</a>
        <a class="a1" href="About">About</a>
        <a class="a1" href="Colors">Colors</a>
        <a class="a1" href="Center Div">Center Div</a>
        <a class="a1" href="Margin Auto">Margin Auto</a>
        <a class="a1" href="Help">Help</a>
      </nav>
    </section>
    <section class="section2">
      <aside class="aside1">
        <h1>My Notes</h1>
        <button class="bb" id="nn">+ New Note</button>

        <h3 class="bb" id="h3">Shopping List</h3>
        <br /><span id="span1"> Today at 10:30 AM</span>

        <h3 class="bb" id="h3">Meeting Notes</h3>
        <br /><span id="span1"> Yesterday</span>

        <h3 class="bb" id="h3">Ideas</h3>
        <br /><span id="span1"> Jan 15,2026</span>

        <h3 class="bb" id="h3">Todo List</h3>
        <br /><span id="span1"> Jan 14,2026</span>
      </aside>
      <main>
        <div id="all">
          <section class="maim-section1">
            <h2>Shopping List</h2>
            <div>
              <button class="button-shoping-list" id="save-shopping">
                Save
              </button>
              <button class="button-shoping-list" id="delete-shopping">
                Delete
              </button>
            </div>
          </section>
          <hr class="hr1" />
          <section class="main-section2">
            <label for="Category">Category:</label>
            <select name="select1" id="Category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Ideas">Ideas</option>
              <option value="Todo">Todo</option>
            </select>
            <label for="input">Tags:</label>
            <input type="text" id="input" placeholder="Add Tags" />
          </section>
          <section class="textarea">
            <textarea name="" id="textarea">
           - Milk
          - Eggs
          - Bread
          - Coffee
          - Fruits
          </textarea
            >
          </section>
          <hr class="hr1" />
          <section class="main-section3">
            <p>Last edited:Today at 10:30 AM</p>
            <p>Words:5</p>
          </section>
        </div>
      </main>
    </section>
    <footer>
      <p class="f1">© 2026 NotesApp. Built with HTML & CSS</p>
      <div class="f1">
        <a href="Privacy">Privacy</a>
        <a href="Terms">Terms</a>
        <a href="Contact">Contact</a>
      </div>
    </footer>
  </body>
</html>
